# Verifikasi otomatis: install, tes, dan typecheck client.
#
# Typecheck memakai baseline. Job gagal bila jumlah "error TS" lebih dari BASELINE.
# Baseline sekarang 0: 5 error lama di client/src/pages/TransactionsPage.tsx sudah diperbaiki
# di main (lihat docs/testing.md). Jangan dinaikkan lagi.
#
# Langkah typecheck dan ringkasan tes berjalan walau tes merah (if: always()),
# supaya jumlah error tsc selalu tercetak di log.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      # Jumlah error tsc yang diterima. 0 = tidak boleh ada error TS.
      BASELINE: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        # Reporter JSON ditulis ke file untuk ringkasan di langkah berikutnya.
        run: npm test -- --reporter=default --reporter=json --outputFile.json=vitest-report.json

      - name: Ringkasan tes gagal per file
        if: always()
        run: |
          if [ ! -f vitest-report.json ]; then
            echo "Laporan tes tidak terbentuk (vitest mungkin crash saat start)."
            exit 0
          fi
          node -e "
            const r = require('./vitest-report.json');
            const cwd = process.cwd() + '/';
            for (const f of r.testResults) {
              const name = f.name.replace(cwd, '');
              const failed = f.assertionResults.filter(a => a.status === 'failed').length;
              if (failed > 0) console.log(failed + ' tes gagal  ' + name);
              else if (f.status === 'failed') console.log('file gagal dimuat  ' + name);
            }
            console.log('Total: ' + r.numFailedTests + ' gagal dari ' + r.numTotalTests + ' tes');
          "

      - name: Typecheck (hitung error vs baseline)
        if: always()
        run: |
          npx tsc -b --noEmit 2>&1 | tee tsc.log || true
          COUNT=$(grep -c "error TS" tsc.log || true)
          echo "Jumlah error TS: ${COUNT} (baseline: ${BASELINE})"
          if [ "${COUNT}" -gt "${BASELINE}" ]; then
            echo "::error::Error tsc bertambah: ${COUNT} > baseline ${BASELINE}"
            exit 1
          fi
